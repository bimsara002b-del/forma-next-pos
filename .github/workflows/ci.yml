name: Next.js POS checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: saas-ci-only
          POSTGRES_DB: forma_saas_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - run: npm run db:generate
        env:
          DATABASE_URL: "file:./ci.db"
      - run: npm run lint
      - run: npm run typecheck
      - name: Create disposable integration test database
        run: npx prisma db push --skip-generate
        env:
          DATABASE_URL: "file:./pos-integration.test.db"
      - name: Create isolated inventory integration database
        run: npx prisma db push --skip-generate
        env:
          DATABASE_URL: "file:./inventory-integration.test.db"
      - name: Create disposable cash-return test database
        run: npx prisma db push --skip-generate
        env:
          DATABASE_URL: "file:./returns-integration.test.db"
      - name: Run unit and SQLite checkout integration tests
        run: npm test
        env:
          POS_TEST_DATABASE_URL: "file:./pos-integration.test.db"
          POS_INVENTORY_TEST_DATABASE_URL: "file:./inventory-integration.test.db"
          POS_RETURN_TEST_DATABASE_URL: "file:./returns-integration.test.db"
      - name: PostgreSQL tenant/RLS and transaction rollback (disposable CI DB)
        run: psql -X -v ON_ERROR_STOP=1 -f tests/security/saas-tenant-foundation.sql
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: saas-ci-only
          PGDATABASE: forma_saas_ci
      - run: npm run build
        env:
          DATABASE_URL: "file:./ci.db"
          POS_ACCESS_PASSWORD: "ci-only-secure-password"
          POS_SESSION_SECRET: "test-session-secret-01234567890123456789012345"
  saas-runtime:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: runtime-admin-test-only
          POSTGRES_DB: forma_saas_runtime_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: packages/saas-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - run: npm run validate
      - run: npm run generate
      - run: npm run typecheck
      - name: Real Prisma adapter, assignment, rollback and pool isolation tests
        run: npm test
        env:
          SAAS_TEST_ADMIN_URL: postgresql://postgres:runtime-admin-test-only@127.0.0.1:5432/forma_saas_runtime_test
          SAAS_TEST_APP_URL: postgresql://forma_runtime_test:runtime-test-only@127.0.0.1:5432/forma_saas_runtime_test
