name: Next.js POS checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run db:generate
        env:
          DATABASE_URL: "file:./ci.db"
      - run: npm run lint
      - run: npm run typecheck
      - name: Create disposable integration test database
        run: npx prisma db push --skip-generate
        env:
          DATABASE_URL: "file:./pos-integration.test.db"
      - name: Create isolated inventory integration database
        run: npx prisma db push --skip-generate
        env:
          DATABASE_URL: "file:./inventory-integration.test.db"
      - name: Run unit and SQLite checkout integration tests
        run: npm test
        env:
          POS_TEST_DATABASE_URL: "file:./pos-integration.test.db"
          POS_INVENTORY_TEST_DATABASE_URL: "file:./inventory-integration.test.db"
      - run: npm run build
        env:
          DATABASE_URL: "file:./ci.db"
          POS_ACCESS_PASSWORD: "ci-only-secure-password"
          POS_SESSION_SECRET: "test-session-secret-01234567890123456789012345"
